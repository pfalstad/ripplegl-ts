<script id="shader-display-fs" type="x-shader/x-fragment">
#define TS_COL_WALL 0
#define TS_COL_POS 1
#define TS_COL_NEG 2
#define TS_COL_NEUTRAL 3
#define TS_COL_POS_MED 4
#define TS_COL_NEG_MED 5
#define TS_COL_MED 6
#define TS_COL_SOURCE 7
#define TS_COL_ABSORB 9
#define TS_COL_COUNT  10

    precision highp float;

    varying vec2 vTextureCoord;
    varying vec4 vPosition;

    uniform sampler2D uSampler;
    uniform float brightness;
    uniform lowp vec3 colors[TS_COL_COUNT];

	// shader for displaying waves on screen
    void main(void) {
        float alpha = 1.0;
        vec4 textureColor = texture2D(uSampler, vec2(vTextureCoord.s, vTextureCoord.t));

		// blue channel used to store walls/media
		float med = textureColor.b;
		vec3 col;
		if (med == 0.0)
			col = colors[TS_COL_WALL];
		else {
			// red channel used to store wave height
			float r =  textureColor.r*brightness;
	        r = clamp(r, -1., 1.);
            if (r > 0.0)
            	col = mix(mix(colors[TS_COL_MED], colors[TS_COL_NEUTRAL], med),
                			mix(colors[TS_COL_POS_MED], colors[TS_COL_POS], med), r);
            else
                col = mix(mix(colors[TS_COL_MED], colors[TS_COL_NEUTRAL], med),
                		    mix(colors[TS_COL_NEG_MED], colors[TS_COL_NEG], med), -r);
			// alpha channel holds 1 - absorption; tint absorbing media towards the absorb color.
			// absorption maxes out at 0.25, which should read as fully saturated
			float absorb = 1.0 - textureColor.a;
			col = mix(col, colors[TS_COL_ABSORB], clamp(absorb * 4.0, 0.0, 1.0));
		}
        gl_FragColor = vec4(col, 1.);
    }
</script>

<script id="shader-draw-fs" type="x-shader/x-fragment">
    precision highp float;

    //varying vec4 vPosition;
	varying vec4 vColor;

    void main(void) {
        gl_FragColor = vColor;
    }
</script>

<script id="shader-draw-vs" type="x-shader/x-vertex">
    attribute vec3 aVertexPosition;
    attribute vec4 aColor;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;

    varying vec4 vPosition;
	varying vec4 vColor;

    void main(void) {
        vPosition = uMVMatrix * vec4(aVertexPosition, 1.0);
        gl_Position = uPMatrix * vPosition;
		vColor = aColor;
    }
</script>

<script id="shader-draw-image-vs" type="x-shader/x-vertex">
    attribute vec3 aVertexPosition;
    attribute vec2 aTextureCoord;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;

    varying vec2 vTextureCoord;

    void main(void) {
        gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
        vTextureCoord = aTextureCoord;
    }
</script>

<script id="shader-draw-image-fs" type="x-shader/x-fragment">
    precision highp float;

    varying vec2 vTextureCoord;
    uniform sampler2D uSampler;

    // maps an imported image onto the blue/alpha (medium/absorption) channels:
    // white -> normal/transparent, black -> wall (med=0), shades of blue -> medium.
    // Grayscale pixels (including anti-aliasing along edges) must NOT be read as
    // blue, so a pixel only counts as "blue" once its blue channel clearly
    // exceeds red/green; otherwise it's treated as a wall/normal pixel based on
    // brightness alone.
    //
    // for blue pixels, refractive index n runs from 1 (white/pale blue) to 2
    // (pure blue) -- the same range MediumBox exposes -- and the stored medium
    // value is 1/(n*n), matching how MediumBox derives its speed index from a
    // refractive index. This naturally keeps med in (0.25, 1], so it never
    // collapses to 0.0, which the simulator reserves for actual walls.
    //
    // white/normal areas are left untouched (discarded rather than writing
    // med=1) so that when images overlap, a white area on top doesn't erase a
    // wall or medium placed by an image underneath it.
    void main(void) {
        vec4 texColor = texture2D(uSampler, vTextureCoord);
        float blueness = texColor.b - max(texColor.r, texColor.g);
        float med;
        if (blueness > 0.08) {
            float purity = min(texColor.r, texColor.g); // 0 = pure blue, 1 = pale/white-blue
            float n = mix(2.0, 1.0, purity);
            med = 1.0 / (n * n);
        } else {
            float gray = (texColor.r + texColor.g + texColor.b) / 3.0;
            if (gray >= 0.5)
                discard;
            med = 0.0;
        }
        gl_FragColor = vec4(0.0, 0.0, med, 1.0);
    }
</script>

<script id="shader-draw-line-fs" type="x-shader/x-fragment">
    precision highp float;

    //varying vec4 vPosition;
	varying vec4 vColor;

    void main(void) {
        gl_FragColor = vec4(vColor.r * exp(-vColor.a*vColor.a), 0., 1., 0.);
    }
</script>

<script id="shader-mode-fs" type="x-shader/x-fragment">
    precision highp float;

    varying vec4 vPosition;
	varying vec4 vColor;

    void main(void) {
		// used to paint mode boxes
        gl_FragColor = vec4(sin(vColor.r)*sin(vColor.g)+sin(vColor.b)*sin(vColor.a), 0., 0., 0.);
    }
</script>

<script id="shader-simulate-fs" type="x-shader/x-fragment">
	// shader for running simulation
    precision highp float;

    varying vec2 vTextureCoord;
    varying vec4 vPosition;
    varying float vDamping;

    uniform sampler2D uSampler;
    uniform float stepSizeX;
    uniform float stepSizeY;

	// get wave value for adjacent square, handling walls properly depending on acoustic flag.
	// returns (value, weight); weight is 0 for neighbors that should be excluded from the
	// average entirely (acoustic/no-flux boundary) rather than substituted with a mirrored value,
	// so staircased (e.g. diagonal) walls don't create asymmetric, non-reciprocal coupling between
	// cells, which otherwise pumps energy into a growing high-frequency mode at wall corners.
	highp vec2 getSquare(highp vec2 offset)
	{
        highp vec2 x = offset+vTextureCoord;
		highp vec4 pv = texture2D(uSampler, x);
        if (pv.b > 0.0)
           return vec2(pv.r, 1.0);
#ifdef ACOUSTIC
        return vec2(0.0, 0.0);
#else
        return vec2(0.0, 1.0);
#endif
	}

void main()
{
        highp float newvel = 0.;
    	highp float newpos = 0.;
        highp vec4 pv = texture2D(uSampler, vTextureCoord);
        if (pv.b > 0.0) {
                highp float pos = pv.r;
                highp float vel = pv.g;
                highp vec2 mid1 = getSquare(vec2(stepSizeX, 0.));
                highp vec2 mid2 = getSquare(vec2(-stepSizeX, 0.));
                highp vec2 mid3 = getSquare(vec2(0., stepSizeY));
                highp vec2 mid4 = getSquare(vec2(0., -stepSizeY));
                highp float wsum = mid1.y+mid2.y+mid3.y+mid4.y;
                // equilibrium position is average of neighbors; wall neighbors are simply
                // excluded and the average renormalized, rather than mirrored in
                highp float mid = wsum > 0.0 ? (mid1.x+mid2.x+mid3.x+mid4.x)/wsum : pos;
                highp float med = pv.b;
				med *= 1.5;
                newvel = med*(mid-pos)+vel*vDamping*pv.a;
        		newpos = pos+newvel;
        }
		// update position and velocity; alpha channel holds per-medium absorption factor
        gl_FragColor = vec4(newpos, newvel, pv.b, pv.a);
}

</script>

<script id="shader-poke-fs" type="x-shader/x-fragment">
    precision highp float;

    varying vec2 vTextureCoord;
    varying vec4 vPosition;
    varying float vDamping;

    uniform sampler2D uSampler;
    uniform vec2 pokePosition;
    uniform float pokeValue;

void main()
{
    highp float newvel = 0.;
    highp float newpos = 0.;
    highp vec4 pv = texture2D(uSampler, vTextureCoord);
    highp float dist = length(vPosition.xy - pokePosition);
    highp float fade = clamp(1.0-dist/0.01, 0.0, 1.0);
    gl_FragColor = vec4(mix(pv.r, pokeValue, fade), mix(pv.g, 0.0, fade), pv.b, pv.a);
}

</script>

<script id="shader-vs" type="x-shader/x-vertex">
    attribute vec3 aVertexPosition;
    attribute vec2 aTextureCoord;
    attribute float aDamping;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;

    varying vec2 vTextureCoord;
    varying vec4 vPosition;
    varying float vDamping;


    void main(void) {
        vPosition = uMVMatrix * vec4(aVertexPosition, 1.0);
        gl_Position = uPMatrix * vPosition;
        vTextureCoord = aTextureCoord;
	vDamping = aDamping;
    }
</script>

<script id="shader-3d-vs" type="x-shader/x-vertex">
#define TS_COL_WALL 0
#define TS_COL_POS 1
#define TS_COL_NEG 2

#define TS_COL_POS_MED 4
#define TS_COL_NEG_MED 5
#define TS_COL_MED 6
#define TS_COL_SOURCE 7
#define TS_COL_NEUTRAL 8
#define TS_COL_ABSORB 9
#define TS_COL_COUNT 10

    attribute highp vec2 aTextureCoord;
    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;
	// left/right texture-x edges of this strip; aTextureCoord.x is 0 or 1 selecting between them.
	// both edges are always passed in using the same formula the neighboring strip uses for its
	// shared edge, so adjacent strips meet at bit-identical coordinates and don't crack apart
	uniform highp float xOffset0;
	uniform highp float xOffset1;

    varying vec2 vTextureCoord;
    varying vec4 vPosition;
	varying vec4 vColor;
    uniform sampler2D uSampler;
    uniform float brightness;
    uniform lowp vec3 colors[TS_COL_COUNT];

    void main(void) {
		highp vec2 tc  = vec2(mix(xOffset0, xOffset1, aTextureCoord.x), aTextureCoord.y);
        vec4 pv = texture2D(uSampler, tc);
		float r =  pv.r*brightness;
        vPosition = uMVMatrix * vec4(-1.0+2.0*tc.x, -1.0+2.0*tc.y, r, 1.0);
        gl_Position = uPMatrix * vPosition;
        vTextureCoord = tc;
		float med = pv.b;
		vec3 col;
		if (med == 0.0)
			col = colors[TS_COL_WALL];
		else {
			// calculate normal
			float qx = texture2D(uSampler, vec2(tc.x+1./200., tc.y)).r-pv.r;
			float qy = texture2D(uSampler, vec2(tc.x, tc.y+1./200.)).r-pv.r;
			qx *= brightness;  qy *= brightness;

			// calculate lighting
			float normdot = (qx+qy+0.1)*(1./1.73)/length(vec3(qx, qy, 0.1));
	        r = 40.*clamp(r, -1., 1.);
                if (r > 0.0)
                        col = mix(mix(colors[TS_COL_MED], colors[TS_COL_NEUTRAL], med),
                      mix(colors[TS_COL_POS_MED], colors[TS_COL_POS], med), r);
                else
                        col = mix(mix(colors[TS_COL_MED], colors[TS_COL_NEUTRAL], med),
                      mix(colors[TS_COL_NEG_MED], colors[TS_COL_NEG], med), -r);
			col = mix(col, vec3(1., 1., 1.), normdot);
			// alpha channel holds 1 - absorption; tint absorbing media towards the absorb color.
			// absorption maxes out at 0.25, which should read as fully saturated
			float absorb = 1.0 - pv.a;
			col = mix(col, colors[TS_COL_ABSORB], clamp(absorb * 4.0, 0.0, 1.0));
		}
        vColor = vec4(col, 1.);

    }
</script>
